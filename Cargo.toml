[workspace]
# Résolveur 3 : tient compte de `rust-version` (MSRV) quand il choisit les
# versions des dépendances.
resolver = "3"
members = [
    "crates/plannercraft-core",
    "crates/plannercraft-mspdi",
    "crates/plannercraft-render",
    "crates/plannercraft-pdf",
    "crates/plannercraft-automation",
    "crates/plannercraft-mcp",
    "crates/plannercraft-ui-egui",
    "apps/plannercraft-cli",
    "apps/plannercraft",
    "apps/plannercraft-web",
    "tests",
    "xtask",
]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
# eframe/egui 0.37 exigent Rust 1.95.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/theodu78/plannercraft"

[workspace.dependencies]
# Crates internes (version explicite : pas de dépendance « wildcard » pour cargo-deny).
plannercraft-core = { path = "crates/plannercraft-core", version = "1.0.0-rc.1" }
plannercraft-mspdi = { path = "crates/plannercraft-mspdi", version = "1.0.0-rc.1" }
plannercraft-render = { path = "crates/plannercraft-render", version = "1.0.0-rc.1" }
plannercraft-pdf = { path = "crates/plannercraft-pdf", version = "1.0.0-rc.1" }
plannercraft-automation = { path = "crates/plannercraft-automation", version = "1.0.0-rc.1" }
plannercraft-mcp = { path = "crates/plannercraft-mcp", version = "1.0.0-rc.1" }
plannercraft-ui-egui = { path = "crates/plannercraft-ui-egui", version = "1.0.0-rc.1" }

# Dates en heure locale du projet, sans fuseau. On ne demande pas `clock`, mais
# cela ne garantit rien : les features s'unifient sur le workspace et rmcp
# active `chrono/now` (et `clock` en wasm). L'interdiction de lire l'heure dans
# plannercraft-core (règle 5) est imposée par `crates/plannercraft-core/clippy.toml`.
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
quick-xml = { version = "0.42.0", features = ["serialize"] }
# rmcp épinglé exactement (ADR-0005 : API mouvante) ; toute montée est un commit dédié.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
# J4 (ADR-0012) : schémas JSON des commandes (plannercraft-automation), déjà tirés
# par rmcp `server` à la même version ; le cœur n'en dépend pas.
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
# Serveur MCP stdio (plannercraft-mcp) : runtime à fil unique, entrées/sorties
# standard. Déjà au lock (tiré par rmcp).
tokio = { version = "1.53.3", default-features = false, features = ["rt", "io-std", "io-util", "macros", "sync"] }
# MCP HTTP (plannercraft-mcp, feature `http`, lot L17) : transport « streamable
# HTTP » de rmcp servi par hyper 1, HTTP/1.1 seulement (pas de h2). Corps de
# la réponse 401 du jeton porteur : http-body-util et bytes, déjà tirés par
# rmcp `transport-streamable-http-server`.
hyper = { version = "1.6.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.11", default-features = false, features = ["server", "http1", "tokio", "service"] }
http-body-util = "0.1.3"
bytes = "1.12.1"
# Jeton du rendez-vous du canal de contrôle (ADR-0002), hors wasm. Déjà au lock.
getrandom = "0.3.4"
egui = "0.37.0"
eframe = "0.37.0"
# Capture relayée (`app.screenshot`, J7 lot L14) : PNG par `image` (format
# PNG seul) puis base64, côté application native. Déjà au lock (tirés par
# egui_kittest et rmcp) ; aucune crate nouvelle.
image = { version = "0.25.10", default-features = false, features = ["png"] }
base64 = "0.23.1"
# Sonde des polices de repli (J7 lot L14, test seulement) : le fournisseur que
# la feature `system_fonts` d'eframe installe sur le desktop. Déjà au lock.
egui_system_font_provider = "0.37.0"
# macOS seulement (apps/plannercraft) : `EventLoopBuilderExtMacOS::with_default_menu`
# retire le menu applicatif par défaut de winit, dont « Quitter » (Cmd+Q)
# appelle `terminate:` sans `CloseRequested`. Même version que celle tirée
# par eframe ; aucune crate nouvelle.
winit = { version = "0.30.13", default-features = false }
# Interface (plannercraft-ui-egui et applications seulement, ADR-0011). rfd sans
# `gtk3` ni `wayland` : son portail XDG charge libdbus par dlopen (aucun paquet
# système à la compilation) et attend ses futurs avec pollster (tiré par
# `xdg-portal`). fluent pour les traductions (fichiers `.ftl` embarqués),
# sys-locale pour la langue du système, js-sys pour « maintenant » sur le web.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# Attente du sélecteur rfd asynchrone dans un fil dédié sur le desktop
# (ADR-0011 : le dialogue synchrone fait avorter winit sur macOS). Déjà tiré
# par eframe ; aucune crate nouvelle.
pollster = "1.0.1"
fluent-bundle = "0.16.0"
unic-langid = { version = "0.9.6", features = ["macros"] }
sys-locale = "0.3.2"
js-sys = "0.3"
# Développement de l'interface : test de complétude des `.ftl` et harnais
# egui_kittest (captures par wgpu, rendu logiciel en CI).
fluent-syntax = "0.12"
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu"] }
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.34"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
cargo_metadata = "0.23.1"
# `cargo xtask panics` : analyse syntaxique des sources, lignes des jetons.
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
toml = "1.1.8"
# Empreintes SHA-256 du corpus public (`cargo xtask corpus fetch` et harnais
# `tests/corpus`) : aucun téléchargement dans `cargo test`.
sha2 = "0.11.1"
# `cargo xtask schema fetch` (ADR-0010, D18) : lecture du MSI du SDK de
# Project 2013 et de son archive CAB, en Rust pur (MIT).
msi = "0.10.0"
cab = "0.6.0"
# CSV des tâches (ADR-0010, D17) dans plannercraft-automation : lecture RFC 4180
# (Unlicense OR MIT) et décodage UTF-16 / Windows-1252 ((Apache-2.0 OR MIT)
# AND BSD-3-Clause), plutôt que des décodeurs faits main.
csv = "1.4.0"
encoding_rs = "0.8.42"
# Repli des noms pour le filtre partagé (R-251, ADR-0016 D2) : NFD puis
# marques combinantes retirées (MIT OR Apache-2.0, lot J8 L2).
unicode-normalization = { version = "0.1.25", default-features = false, features = ["std"] }
# Dépendances de développement de plannercraft-core (ADR-0008) : JSON de référence et
# aller-retour serde, tests de propriétés. proptest sans `fork` ni `timeout`
# (inutiles ici, et autant de crates en moins).
serde_json = "1.0.154"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Benchmarks informatifs : conversions de calendrier (ADR-0008, non exécuté
# en CI, seulement compilé par clippy --all-targets) et moteur (ADR-0009,
# `tests/benches/schedule.rs`, exécuté par le job CI `perf`). Sans rayon ni
# plotters : ni parallélisme ni graphiques, autant de crates en moins.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Export PDF (plannercraft-pdf, ADR-0016 D8) : krilla épinglé exactement, sans
# fonctions par défaut (ni rustybuzz, ni images matricielles : essai L0
# consigné dans ADR-0016). skrifa à la version tirée par krilla (cmap).
krilla = { version = "=0.8.2", default-features = false }
skrifa = { version = "0.42.1", default-features = false, features = ["std"] }
# Validation XSD des documents écrits (P26, ADR-0010 D17) : dépendance de
# développement de plannercraft-tests, Rust pur, BSD-2-Clause.
uppsala = "0.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Règle 10 « ne jamais planter » : interdits hors tests.
# Les tests les lèvent par des `#![allow(...)]` locaux et commentés.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
# Tout `#[allow]` donne sa raison (`reason = "..."`). `cargo xtask panics`
# refuse en plus qu'un interdit ci-dessus soit levé hors du code de test.
allow_attributes_without_reason = "deny"
# Limites connues (ADR-0006) : aucune lint ne couvre l'indexation d'une map
# (`map[&key]`) ; `assert!` et sa famille sont refusés par `cargo xtask panics`.
# `float_arithmetic` n'est interdit que dans plannercraft-core (attribut de crate) :
# le rendu SVG et l'interface egui calculent nativement en f32/f64.

# Propriétés du moteur (P13 à P17) : 10 000 cas en CI. En debug pur, le
# fichier `schedule_properties` dépasse 60 s (90 s mesurées pour 10 000 cas
# sur 4 cœurs) ; une optimisation légère de plannercraft-core et de ses tests le
# ramène sous ce seuil sans toucher aux assertions de débordement.
[profile.test.package.plannercraft-core]
opt-level = 1

# Version web (J8, lot L13, C-REL-05) : `cargo_profile` de
# `apps/plannercraft-web/Trunk.toml`. LTO complet et une seule unité de code
# (taille du .wasm) ; `panic` inchangé (le crochet de panique d'eframe
# reste actif). `opt-level` : « z » mesuré contre « s » (ADR-0016, budget
# du web : 3 518 979 contre 3 960 257 octets gzip -9 après wasm-opt -Oz).
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"
