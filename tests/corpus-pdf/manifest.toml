# Corpus public de l'import PDF (ADR-0032, lot P1a).
#
# Plannings Gantt publics, pour la plupart imprimés en PDF depuis MS Project.
# Les fichiers ne sont PAS commités (droits de redistribution non vérifiés) :
# `cargo xtask corpus fetch-pdf` les télécharge dans tests/corpus-pdf/files/,
# ignoré par git, et contrôle taille et SHA-256. Seul ce manifeste est
# versionné. Clés lues par le téléchargement : name, url, mirrors, size,
# sha256 ; par le test `crates/plannercraft-pdfimport/tests/corpus.rs` :
# expect (`import` ou code de refus), tasks (tâches lues attendues) et
# min_dates_equal (plancher des dates calculées égales aux dates lues, au
# jour, règle R-271 par défaut). Mesure et URL commentées :
# docs/plans/pdf-import.md.

