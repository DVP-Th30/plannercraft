[package]
name = "plannercraft-tests"
description = "Harnais de tests transverses de PlannerCraft : règles R-xxx, fixtures, oracle MS Project, corpus public."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# Arborescence imposée par le brief (tests/rules, tests/oracle, tests/corpus) :
# les cibles sont déclarées à la main, pas découvertes.
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "lib.rs"

[[test]]
name = "rules"
path = "rules/main.rs"

[[test]]
name = "oracle"
path = "oracle/main.rs"

[[test]]
name = "corpus"
path = "corpus/main.rs"

# Conformité au schéma MSPDI pj15 (P26, P27) ; sautée si le XSD est absent,
# sauf sous `PLANNERCRAFT_SCHEMA=required` (job CI `schema`).
[[test]]
name = "schema"
path = "schema/main.rs"

# Budget de performance du moteur (ignoré hors du job CI `perf`, en release).
[[test]]
name = "perf"
path = "perf/main.rs"

# Captures PDF des six modèles et du réseau de 5 000 tâches (J8, lot L16,
# vérification 4) ; PDF écrits sous `PLANNERCRAFT_PDF_CAPTURES` (job CI
# `pdf-captures`, rendus en PNG par pdftoppm).
[[test]]
name = "pdf_captures"
path = "pdf_captures/main.rs"

# Benchmark informatif du moteur (criterion), exécuté par le job CI `perf`.
[[bench]]
name = "schedule"
path = "benches/schedule.rs"
harness = false

[dependencies]
chrono.workspace = true
plannercraft-automation.workspace = true
plannercraft-core.workspace = true
plannercraft-mspdi.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
criterion.workspace = true
uppsala.workspace = true

[lints]
workspace = true
