# Corpus public de l'import .mpp (ADR-0036, lot M1).
#
# Sélection de fichiers .mpp de test publics du dépôt joniles/mpxj (données
# enregistrées par MS Project, pas de code), adresses figées sur un commit,
# puis fichiers réels de dépôts GitHub publics (projets d'étudiants, cours,
# livre ; adresses figées sur le commit du dépôt).
# Les fichiers ne sont PAS commités : `cargo xtask corpus fetch-mpp` les
# télécharge dans tests/corpus-mpp/files/, ignoré par git, et contrôle taille
# et SHA-256. Seul ce manifeste est versionné. Clés lues par le
# téléchargement : name, url, mirrors, size, sha256 ; par le test
# `crates/plannercraft-mpp/tests/corpus.rs` : expect (`import` ou code de
# refus), et pour un import tasks, null_tasks, links, calendars,
# calendar_exceptions, project_start, min_identical (tâches dont les dates
# recalculées par le moteur égalent les dates enregistrées, plancher).
# Valeurs attendues : lues par le lecteur du dépôt et vérifiées contre le
# corrigé externe (docs/plans/mpp-import.md), jamais copiées du corrigé.

format = 1

