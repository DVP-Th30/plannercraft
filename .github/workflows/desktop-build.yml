# Construction des artefacts de plateforme de PlannerCraft (J8, lot L1) :
# - macOS : `PlannerCraft.app` universel (x86_64 + arm64), avec la CLI dans
#   `cli/plannercraft`, dans un DMG ; signé Developer ID et notarisé par Apple
#   quand les secrets de signature sont posés, signé ad hoc sinon (ADR-0029) ;
# - Windows : zip de `plannercraft-desktop.exe`, `plannercraft.exe` et `README.txt` ;
# - Linux : archive construite dans un conteneur `debian:bookworm` (glibc
#   2.36 : les binaires tournent sur toute distribution plus récente) ;
# - web : `dist` de trunk.
# Chaque artefact s'appelle `plannercraft-<version>-<plateforme>.<ext>`, version du
# workspace (job `version`). Chacun porte un dossier `licenses/` : textes de
# la licence du code (MIT, Apache-2.0), `NOTICE` et licences des composants
# tiers embarqués, aux chemins que cite `NOTICE` (police Inter, OFL ; icônes
# Lucide, ISC et MIT ; ADR-0017, lot L6), vérifié par `release.yml`.
#
# Deux usages, une seule définition des builds :
# - préversions : tag `ui-*` poussé, ou lancement manuel (`workflow_dispatch`,
#   visible une fois ce fichier sur la branche par défaut) ; artefacts
#   d'Actions seulement, ni vérification ni publication ;
# - release : appelé par `release.yml` (`workflow_call`), qui vérifie les
#   artefacts (C-REL-02 à C-REL-06) puis les publie.
# Jeton en lecture seule. Secrets : les cinq de la signature macOS seulement
# (ADR-0029, `docs/features/release.md` § 6), tous facultatifs, lus par les
# seules étapes de signature et de notarisation du job `build-macos` ; aucun
# déclencheur `pull_request` (un fork ne les atteint pas).
name: Desktop build

on:
  workflow_dispatch: {}
  push:
    tags: ['ui-*']
  workflow_call:
    secrets:
      MACOS_CERTIFICATE_P12_BASE64:
        description: Certificat « Developer ID Application » et sa clé privée (.p12 en base64)
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        description: Mot de passe du .p12
        required: false
      APPLE_API_KEY_P8:
        description: Clé d'équipe App Store Connect (contenu du fichier AuthKey_<id>.p8)
        required: false
      APPLE_API_KEY_ID:
        description: Identifiant de la clé App Store Connect
        required: false
      APPLE_API_ISSUER_ID:
        description: Identifiant de l'émetteur (Issuer ID) App Store Connect
        required: false
    outputs:
      version:
        description: Version du workspace (noms des artefacts, `--version` attendu)
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version du workspace
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Lire [workspace.package] version
        id: read
        run: |
          version="$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version : $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-macos:
    name: macOS (DMG universel)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Même plancher que `LSMinimumSystemVersion` de l'Info.plist.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build (x86_64 puis arm64)
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --release --locked -p plannercraft -p plannercraft-cli --target "$target"
          done

      - name: Binaires universels
        run: |
          mkdir -p universal
          for bin in plannercraft-desktop plannercraft; do
            lipo -create -output "universal/$bin" \
              "target/x86_64-apple-darwin/release/$bin" \
              "target/aarch64-apple-darwin/release/$bin"
            lipo -archs "universal/$bin"
          done

      - name: PlannerCraft.app, icône, dossier du DMG
        run: |
          app=stage/PlannerCraft.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" stage/cli
          short="${VERSION%%-*}"
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHORT_VERSION@/$short/g" \
            packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          cp universal/plannercraft-desktop "$app/Contents/MacOS/plannercraft-desktop"
          # Icône : jeu iconutil (1x et 2x) tiré de assets/icon (cargo xtask icon).
          mkdir plannercraft.iconset
          for n in 16 32 128 256 512; do
            cp "assets/icon/plannercraft-$n.png" "plannercraft.iconset/icon_${n}x${n}.png"
            cp "assets/icon/plannercraft-$((n * 2)).png" "plannercraft.iconset/icon_${n}x${n}@2x.png"
          done
          iconutil -c icns plannercraft.iconset -o "$app/Contents/Resources/plannercraft.icns"
          cp universal/plannercraft stage/cli/plannercraft
          cp packaging/macos/LISEZ-MOI.txt stage/LISEZ-MOI.txt
          mkdir -p "stage/licenses/assets/fonts" "stage/licenses/assets/icons/lucide"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "stage/licenses/"
          cp assets/fonts/OFL.txt "stage/licenses/assets/fonts/"
          cp assets/icons/lucide/LICENSE "stage/licenses/assets/icons/lucide/"
          ln -s /Applications stage/Applications

      # ADR-0029. Sans aucun des cinq secrets : signature ad hoc, comme avant
      # (branche d'un contributeur, dépôt dérivé). Avec les cinq : certificat
      # Developer ID dans un trousseau temporaire, exécution renforcée
      # (hardened runtime) et horodatage, exigés par la notarisation. Avec
      # une partie seulement : échec, pour ne pas publier un DMG à moitié signé.
      - name: Signature (Developer ID si les secrets sont posés, ad hoc sinon)
        id: sign
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          app=stage/PlannerCraft.app
          present=0
          missing=""
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -n "${!name}" ]; then present=$((present + 1)); else missing="$missing $name"; fi
          done
          if [ "$present" -eq 0 ]; then
            echo "::notice::Secrets de signature absents : signature ad hoc, DMG non notarisé."
            codesign --force -s - stage/cli/plannercraft
            codesign --force --deep -s - "$app"
            echo "developer_id=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "::error::Secrets de signature incomplets, manquent :$missing"
            exit 1
          fi

          keychain="$RUNNER_TEMP/plannercraft-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do
            existing+=("$line")
          done < <(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          security list-keychains -d user -s "$keychain" "${existing[@]}"

          find_identity() {
            security find-identity -v -p codesigning "$keychain" \
              | awk '/"Developer ID Application: / { print $2; exit }'
          }
          identity="$(find_identity)"
          if [ -z "$identity" ]; then
            # Un .p12 exporté sans sa chaîne : certificats intermédiaires
            # Developer ID d'Apple (publics), puis second essai.
            for ca in DeveloperIDG2CA DeveloperIDCA; do
              if curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"; then
                security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" || true
              fi
            done
            identity="$(find_identity)"
          fi
          if [ -z "$identity" ]; then
            echo "::error::Aucune identité « Developer ID Application » valide dans le .p12 (attendu : le certificat et sa clé privée, exportés ensemble)."
            security find-identity -p codesigning "$keychain" || true
            exit 1
          fi

          codesign --force --options runtime --timestamp --keychain "$keychain" \
            --identifier io.github.dvp-th30.plannercraft.cli --sign "$identity" stage/cli/plannercraft
          codesign --force --options runtime --timestamp --keychain "$keychain" \
            --sign "$identity" "$app"
          codesign --verify --strict --verbose=2 stage/cli/plannercraft
          codesign --verify --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app"
          {
            echo "developer_id=true"
            echo "identity=$identity"
            echo "keychain=$keychain"
          } >> "$GITHUB_OUTPUT"

      # Première soumission : l'application et la CLI, dans un zip. Le ticket
      # est agrafé à l'application (elle s'ouvre hors ligne une fois copiée
      # hors du DMG) ; un binaire nu ne s'agrafe pas, son ticket reste en ligne.
      - name: Notarisation de l'application et de la CLI
        if: steps.sign.outputs.developer_id == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir notarize
          ditto stage/PlannerCraft.app notarize/PlannerCraft.app
          cp stage/cli/plannercraft notarize/plannercraft
          ditto -c -k notarize notarize.zip
          packaging/macos/notarize.sh notarize.zip
          xcrun stapler staple stage/PlannerCraft.app
          xcrun stapler validate stage/PlannerCraft.app

      - name: DMG
        run: |
          hdiutil create -volname "PlannerCraft $VERSION" -srcfolder stage -format UDZO -ov \
            "plannercraft-$VERSION-macos-universal.dmg"

      # Seconde soumission : le DMG lui-même, signé puis agrafé (Gatekeeper
      # l'accepte hors ligne dès le téléchargement).
      - name: Signature et notarisation du DMG
        if: steps.sign.outputs.developer_id == 'true'
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          KEYCHAIN: ${{ steps.sign.outputs.keychain }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          dmg="plannercraft-$VERSION-macos-universal.dmg"
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$dmg"
          packaging/macos/notarize.sh "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type execute --verbose=2 stage/PlannerCraft.app
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Suppression du trousseau temporaire
        if: always() && steps.sign.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.sign.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true

      - uses: actions/upload-artifact@v4
        with:
          name: plannercraft-${{ needs.version.outputs.version }}-macos-universal.dmg
          path: plannercraft-${{ needs.version.outputs.version }}-macos-universal.dmg
          if-no-files-found: error

  build-windows:
    name: Windows (zip x86_64)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p plannercraft -p plannercraft-cli --target x86_64-pc-windows-msvc

      - name: Zip
        run: |
          dir="plannercraft-$VERSION-windows-x86_64"
          mkdir "$dir"
          cp target/x86_64-pc-windows-msvc/release/plannercraft-desktop.exe \
            target/x86_64-pc-windows-msvc/release/plannercraft.exe \
            packaging/windows/README.txt "$dir/"
          mkdir -p "$dir/licenses/assets/fonts" "$dir/licenses/assets/icons/lucide"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "$dir/licenses/"
          cp assets/fonts/OFL.txt "$dir/licenses/assets/fonts/"
          cp assets/icons/lucide/LICENSE "$dir/licenses/assets/icons/lucide/"
          7z a -tzip "$dir.zip" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: plannercraft-${{ needs.version.outputs.version }}-windows-x86_64.zip
          path: plannercraft-${{ needs.version.outputs.version }}-windows-x86_64.zip
          if-no-files-found: error

  build-linux:
    name: Linux (x86_64, debian:bookworm)
    needs: version
    runs-on: ubuntu-24.04
    container: debian:bookworm
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Avant le checkout : git (clone réel) ; gcc et libc6-dev pour l'édition
      # de liens ; aucun autre paquet système n'est exigé à la compilation.
      - name: Outils du conteneur
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gcc libc6-dev

      - uses: actions/checkout@v7

      - name: rustup (stable, profil minimal)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p plannercraft -p plannercraft-cli

      - name: Archive
        run: |
          dir="plannercraft-$VERSION-linux-x86_64"
          mkdir "$dir"
          cp target/release/plannercraft-desktop target/release/plannercraft packaging/linux/plannercraft.desktop "$dir/"
          cp assets/icon/plannercraft-256.png "$dir/plannercraft.png"
          mkdir -p "$dir/licenses/assets/fonts" "$dir/licenses/assets/icons/lucide"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "$dir/licenses/"
          cp assets/fonts/OFL.txt "$dir/licenses/assets/fonts/"
          cp assets/icons/lucide/LICENSE "$dir/licenses/assets/icons/lucide/"
          chmod +x "$dir/plannercraft-desktop" "$dir/plannercraft"
          tar czf "$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: plannercraft-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
          path: plannercraft-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
          if-no-files-found: error

  build-web:
    name: Web (trunk, wasm32)
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - name: trunk build
        working-directory: apps/plannercraft-web
        run: trunk build --release --locked

      - name: Archive
        run: |
          dist=apps/plannercraft-web/dist
          ls -l "$dist"
          {
            echo "Version web de PlannerCraft $VERSION : fichiers statiques, à servir en HTTP (pas en file://)."
            echo "Par exemple, depuis le dossier qui contient dist : python3 -m http.server -d dist 8080"
            echo "Puis ouvrir http://localhost:8080 dans un navigateur récent (WebGPU ou WebGL2)."
          } > "$dist/README.txt"
          mkdir -p "$dist/licenses/assets/fonts" "$dist/licenses/assets/icons/lucide"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "$dist/licenses/"
          cp assets/fonts/OFL.txt "$dist/licenses/assets/fonts/"
          cp assets/icons/lucide/LICENSE "$dist/licenses/assets/icons/lucide/"
          tar czf "plannercraft-$VERSION-web.tar.gz" -C apps/plannercraft-web dist

      - uses: actions/upload-artifact@v4
        with:
          name: plannercraft-${{ needs.version.outputs.version }}-web.tar.gz
          path: plannercraft-${{ needs.version.outputs.version }}-web.tar.gz
          if-no-files-found: error
